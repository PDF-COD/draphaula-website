<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211915">
  <meta name="description" content="Links oficiais da Dra. Phaula Ferreira — atendimento, localização e site.">
  <title>Dra. Phaula Ferreira | Links oficiais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso: #211915;
      --coffee: #382820;
      --parchment: #c8ad7d;
      --parchment-light: #dfcca6;
      --parchment-pale: #eee2c8;
      --brass: #9a7847;
      --brass-light: #c4a66e;
      --burgundy: #6c3032;
      --burgundy-deep: #4d2024;
      --olive: #50513b;
      --ink: #2b2019;
      --cream: #f4ead6;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Raleway", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 6%, rgba(159, 123, 72, 0.22), transparent 24%),
        radial-gradient(circle at 88% 82%, rgba(108, 48, 50, 0.15), transparent 26%),
        linear-gradient(145deg, #171210 0%, var(--espresso) 48%, #110e0c 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        repeating-radial-gradient(circle at 20% 30%, transparent 0 2px, rgba(255,255,255,.018) 2px 3px),
        repeating-linear-gradient(118deg, transparent 0 12px, rgba(255,255,255,.012) 12px 13px);
      mix-blend-mode: screen;
    }

    .page {
      width: min(100% - 24px, 510px);
      margin: 0 auto;
      padding: 24px 0 26px;
    }

    .folio {
      position: relative;
      padding: 27px 25px 26px;
      text-align: center;
      border: 1px solid rgba(214, 184, 128, 0.72);
      border-radius: 28px 28px 20px 20px;
      background:
        linear-gradient(rgba(225, 205, 164, .12), rgba(126, 86, 52, .08)),
        url("fundo-rosas-vintage.png") center / cover no-repeat;
      box-shadow:
        0 26px 74px rgba(0, 0, 0, 0.52),
        inset 0 1px 0 rgba(255, 247, 220, 0.78),
        inset 0 0 38px rgba(68, 43, 28, 0.13);
      overflow: hidden;
      isolation: isolate;
    }

    .folio::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 8px;
      border: 1px solid rgba(82, 48, 31, 0.24);
      border-radius: 21px 21px 14px 14px;
      pointer-events: none;
    }

    .folio::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background:
        repeating-radial-gradient(circle at 30% 40%, rgba(63, 42, 26, .11) 0 0.7px, transparent 0.7px 4px),
        repeating-linear-gradient(5deg, transparent 0 7px, rgba(255,255,255,.035) 7px 8px);
      mix-blend-mode: multiply;
    }

    .folio > * {
      position: relative;
      z-index: 2;
    }

    .monogram {
      display: grid;
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;
      place-items: center;
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.08em;
      border: 1px solid var(--brass-light);
      border-radius: 50%;
      background: var(--espresso);
      box-shadow: 0 0 0 3px rgba(78, 48, 31, 0.12);
    }

    .portrait-frame {
      position: relative;
      width: 164px;
      height: 164px;
      margin: 0 auto 19px;
      padding: 6px;
      border: 1px solid rgba(54, 35, 24, 0.74);
      border-radius: 50%;
      background: linear-gradient(140deg, #d7bc82, #5b4129 38%, #b38d54 70%, #30221b);
      box-shadow:
        0 14px 30px rgba(48, 29, 20, 0.34),
        0 0 0 5px rgba(230, 210, 169, 0.38),
        0 0 0 7px rgba(72, 43, 28, 0.22);
    }

    .portrait-frame::before,
    .portrait-frame::after {
      content: "✦";
      position: absolute;
      top: 50%;
      color: var(--burgundy-deep);
      font-size: 0.72rem;
      transform: translateY(-50%);
    }

    .portrait-frame::before { left: -17px; }
    .portrait-frame::after { right: -17px; }

    .portrait {
      display: block;
      width: 100%;
      height: 100%;
      border: 3px solid var(--parchment-light);
      border-radius: 50%;
      object-fit: cover;
      object-position: center 34%;
      background: var(--coffee);
    }

    h1 {
      margin: -2px 0 0;
      color: var(--burgundy-deep);
      font-family: "Pinyon Script", "Cormorant Garamond", cursive;
      font-size: clamp(3.05rem, 11.5vw, 4.05rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255, 240, 205, 0.4);
    }

    .credential {
      margin: 9px 0 0;
      color: var(--coffee);
      font-size: 0.71rem;
      font-weight: 600;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .tagline {
      max-width: 345px;
      margin: 14px auto 0;
      color: #4b382b;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.08rem;
      font-style: italic;
      font-weight: 600;
      line-height: 1.42;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 138px;
      margin: 14px auto 3px;
      color: var(--burgundy-deep);
      font-family: Georgia, serif;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 45px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--brass));
    }

    .divider::after { transform: scaleX(-1); }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .link-card {
      display: grid;
      grid-template-columns: 48px 1fr 20px;
      align-items: center;
      gap: 13px;
      min-height: 77px;
      padding: 13px 15px;
      color: var(--cream);
      text-align: left;
      text-decoration: none;
      border: 1px solid rgba(207, 175, 115, 0.48);
      border-radius: 14px;
      background: linear-gradient(135deg, #2d211b, var(--coffee));
      box-shadow:
        0 10px 24px rgba(43, 28, 19, 0.22),
        inset 0 1px 0 rgba(255, 238, 202, 0.08);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--brass-light);
      box-shadow: 0 14px 30px rgba(43, 28, 19, 0.32);
      outline: none;
    }

    .link-card.primary {
      border-color: rgba(224, 190, 132, 0.56);
      background: linear-gradient(135deg, var(--burgundy-deep), var(--burgundy));
    }

    .link-card.location {
      background: linear-gradient(135deg, #303123, var(--olive));
    }

    .icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      color: var(--brass-light);
      border: 1px solid rgba(219, 187, 128, 0.24);
      border-radius: 50%;
      background: rgba(14, 10, 8, 0.22);
    }

    .icon svg { width: 23px; height: 23px; }

    .link-copy strong {
      display: block;
      margin-bottom: 3px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.05;
    }

    .link-copy span {
      display: block;
      color: rgba(244, 234, 214, 0.74);
      font-size: 0.72rem;
      font-weight: 400;
      line-height: 1.36;
    }

    .arrow {
      width: 19px;
      height: 19px;
      color: var(--brass-light);
      transition: transform 180ms ease;
    }

    .link-card:hover .arrow { transform: translateX(3px); }

    .link-card,
    .link-card.primary,
    .link-card.location {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 1;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      text-align: center;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-3px) scale(1.012);
      border-color: transparent;
      box-shadow: none;
    }

    .link-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      filter: drop-shadow(0 9px 12px rgba(51, 32, 22, 0.2));
    }

    .note {
      margin: 18px auto 0;
      max-width: 345px;
      color: #4b382b;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.69rem;
      font-style: italic;
      font-weight: 600;
      line-height: 1.45;
    }

    footer {
      padding: 18px 12px 0;
      color: #c7aa74;
      text-align: center;
      font-size: 0.64rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      .page { width: min(100% - 16px, 510px); padding: 9px 0 18px; }
      .folio { padding: 22px 16px 23px; border-radius: 23px 23px 17px 17px; }
      .folio::before { inset: 6px; border-radius: 17px 17px 12px 12px; }
      .monogram { margin-bottom: 12px; }
      .portrait-frame { width: 148px; height: 148px; }
      .link-card { grid-template-columns: 45px 1fr 18px; gap: 11px; padding: 12px; }
      .icon { width: 45px; height: 45px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="folio" aria-labelledby="profile-name">
      <div class="portrait-frame">
        <img class="portrait" src="foto-dra-phaula-v1.jpeg" alt="Retrato da Dra. Phaula Ferreira">
      </div>

      <h1 id="profile-name">Dra. Phaula Ferreira</h1>
      <p class="credential">Médica · CRM-GO 38980</p>
      <p class="tagline">Ciência, ética e cuidado humano em cada etapa da sua saúde.</p>
      <div class="divider" aria-hidden="true">❦</div>

      <nav class="links" aria-label="Links oficiais">
        <a class="link-card primary" href="https://wa.me/5562984284282?text=Ol%C3%A1%2C%20gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20o%20atendimento." target="_blank" rel="noopener noreferrer" aria-label="Agendar pelo WhatsApp">
          <img src="botao-whatsapp-floral-v2.png" alt="Agendar pelo WhatsApp">
        </a>

        <a class="link-card location" href="https://www.google.com/maps/place/Consult%C3%B3rio+M%C3%A9dico+-+Dra.+Phaula/data=!4m2!3m1!1s0x0:0x1a7f2ff73c6f1a40" target="_blank" rel="noopener noreferrer" aria-label="Como chegar">
          <img src="botao-como-chegar-floral-v3.png" alt="Como chegar">
        </a>

        <a class="link-card" href="https://draphaula.com.br/" target="_blank" rel="noopener noreferrer" aria-label="Conheça meu trabalho">
          <img src="botao-conheca-trabalho-floral-v2.png" alt="Conheça meu trabalho">
        </a>
      </nav>

      <p class="note">Atendimento médico com escuta, acolhimento e decisões compartilhadas.</p>
    </section>

    <footer>Goiânia · Goiás · © 2026 Dra. Phaula Ferreira</footer>
  </main>
</body>
</html>
